name: CI

# Runs the tests of the Matriz backend and of the web interface, and a smoke test of the Docker stack and the end-to-end test (Playwright), on every pull request and on every push to main.
# The database below only exists while the job runs, so its credentials are fake values
# (AGENTS.md, section 7): nothing here is a real secret.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: matriz

    services:
      postgres: &postgres # the same service is used by the e2e job below
        image: postgres:16
        env:
          POSTGRES_USER: matriz_ci
          POSTGRES_PASSWORD: ci-only-fake-password
          POSTGRES_DB: matriz_test # the tests only run against a database whose name ends with _test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U matriz_ci -d matriz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/matriz_test
      TEST_DB_USER: matriz_ci
      TEST_DB_PASSWORD: ci-only-fake-password
      DB_URL: jdbc:postgresql://localhost:5432/matriz_test
      DB_USER: matriz_ci
      DB_PASSWORD: ci-only-fake-password

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: matriz/pom.xml

      - name: Build and test
        run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the dependencies of package-lock.json
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests of the components
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://matriz.invalid # a production build needs an address; this one is never called

  docker:
    # The images are only built when the backend, the interface and the end-to-end checks have all passed
    needs: [test, frontend, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Fake values, only for this job (AGENTS.md, section 7): the stack below only exists while the job runs.
    env:
      DB_PASSWORD: ci-only-fake-database-password
      DEMO_PASSWORD: Ci-only-fake-1234

    steps:
      - uses: actions/checkout@v4

      - name: Build the images, start the stack and run the smoke test
        run: .github/scripts/docker-smoke.sh

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres: *postgres

    # Fake values, only for this job (AGENTS.md, section 7). There is no .env here: e2e/test-db.sh reads them from the environment.
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/matriz_test
      TEST_DB_USER: matriz_ci
      TEST_DB_PASSWORD: ci-only-fake-password

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: matriz/pom.xml

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the dependencies of package-lock.json
        run: npm ci
        working-directory: frontend

      - name: Cache the browser of the tests
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install the browser of the tests
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: End-to-end test
        run: npm run e2e
        working-directory: frontend

      # Screenshots exist only to diagnose a failure (no traces here: they would contain the password of the run)
      - name: Keep the screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
