  <text x="84" y="562" class="q">Delegate</text><text x="168" y="562" class="g">urgent, not important</text>
  <rect class="box" x="84" y="578" width="250" height="100"/>
  <text x="94" y="600" class="b">Reply to supplier</text><text x="94" y="620" class="g">Due 2026-11-12</text><text x="94" y="638" class="g">Luis G.</text>
  <rect class="chip" x="94" y="648" width="90" height="20" rx="10"/><text x="139" y="662" class="m s">To do</text>

