<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <title>Matriz - wireframe of the Matrix screen (low fidelity)</title>
  <desc>Low-fidelity wireframe of the project Matrix screen (F04). All data is fictitious.</desc>

  <!-- Page -->
