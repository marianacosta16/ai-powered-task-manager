<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <title>Matriz - wireframe of the Matrix tab of the Project detail screen (low fidelity)</title>
  <desc>Low-fidelity wireframe of the Matrix tab of the Project detail screen (F04). All data is fictitious.</desc>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#333}
    .g{fill:#777}.b{font-weight:bold}.s{font-size:11px}.m{text-anchor:middle}.w{fill:#fff}.l{font-size:20px;font-weight:bold}.q{font-size:16px;font-weight:bold}
    .box{fill:#fff;stroke:#333}.bar{fill:#eee;stroke:#333}.sel{fill:#ddd;stroke:#333}.dash{fill:#fff;stroke:#666;stroke-dasharray:5 4}
    .quad{fill:#f7f7f7;stroke:#999}.chip{fill:#eee;stroke:#666}.dark{fill:#333;stroke:#333}
    .c{fill:#333;stroke:#fff;stroke-width:1.5}.n{font-size:12px;font-weight:bold;fill:#fff;text-anchor:middle}
  </style>

  <rect x="0" y="0" width="1200" height="800" fill="#ffffff"/>
  <rect x="10" y="10" width="1180" height="730" fill="#ffffff" stroke="#333333" stroke-width="2"/>

