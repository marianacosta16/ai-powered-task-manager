  <circle class="c" cx="30" cy="92" r="11"/><text class="n" x="30" y="96">1</text>
  <circle class="c" cx="30" cy="122" r="11"/><text class="n" x="30" y="126">2</text>
  <circle class="c" cx="870" cy="118" r="11"/><text class="n" x="870" y="122">3</text>
  <circle class="c" cx="30" cy="228" r="11"/><text class="n" x="30" y="232">4</text>
  <circle class="c" cx="30" cy="272" r="11"/><text class="n" x="30" y="276">5</text>
  <circle class="c" cx="1040" cy="272" r="11"/><text class="n" x="1040" y="276">6</text>
  <circle class="c" cx="250" cy="322" r="11"/><text class="n" x="250" y="326">7</text>
  <circle class="c" cx="70" cy="336" r="11"/><text class="n" x="70" y="340">8</text>
  <circle class="c" cx="84" cy="378" r="11"/><text class="n" x="84" y="382">9</text>

  <text x="10" y="765">Dashed outline = shown only to the project manager, and not in a Completed project. Numbers refer to docs/ui/matrix-wireframe.md.</text>
  <text x="10" y="783" class="g">Low-fidelity wireframe. All names and tasks are fictitious.</text>
</svg>
