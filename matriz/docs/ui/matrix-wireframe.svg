  <rect class="dash" x="870" y="118" width="95" height="30" rx="3"/><text x="917" y="138" class="m s" style="fill:#666">Edit project</text>
  <rect class="dash" x="975" y="118" width="60" height="30" rx="3"/><text x="1005" y="138" class="m s" style="fill:#666">Team</text>
  <rect class="dash" x="1045" y="118" width="110" height="30" rx="3"/><text x="1100" y="138" class="m s" style="fill:#666">Delete project</text>

