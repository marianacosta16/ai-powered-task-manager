  <rect class="chip" x="649" y="448" width="90" height="20" rx="10"/><text x="694" y="462" class="m s">To do</text><text x="879" y="462" class="s g" style="text-anchor:end">1 subtask</text>
  <rect class="box" x="905" y="378" width="250" height="100"/>
  <text x="915" y="400" class="b">Write user guide</text><text x="915" y="420" class="g">Due 2026-12-15</text><text x="915" y="438" class="g">Marta S.</text>
  <rect class="chip" x="915" y="448" width="90" height="20" rx="10"/><text x="960" y="462" class="m s">In review</text>

