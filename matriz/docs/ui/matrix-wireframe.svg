  <text x="639" y="562" class="q">Later</text><text x="696" y="562" class="g">not urgent, not important</text>
  <rect class="box" x="639" y="578" width="250" height="100"/>
  <text x="649" y="600" class="b">Tidy shared folder</text><text x="649" y="620" class="g">Due 2026-12-30</text><text x="649" y="638" class="g">Ana E.</text>
  <rect class="chip" x="649" y="648" width="90" height="20" rx="10"/><text x="694" y="662" class="m s">To do</text>

