  <rect x="625" y="465" width="545" height="265" fill="#f7f7f7" stroke="#999999"/>
  <text x="639" y="491" font-size="16" font-weight="bold" fill="#333333">Later</text>
  <text x="696" y="491" fill="#777777">not urgent, not important</text>
  <rect x="639" y="509" width="250" height="100" fill="#ffffff" stroke="#333333"/>
