<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780">
  <title>Matriz - wireframe of the Projects screen (low fidelity)</title>
  <desc>Low-fidelity wireframe of the Projects screen (F01, F09, F22, US01, US12): list and search, create and edit form, delete confirmation. All data is fictitious.</desc>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#333}
    .g{fill:#777}.b{font-weight:bold}.s{font-size:11px}.m{text-anchor:middle}.w{fill:#fff}.l{font-size:20px;font-weight:bold}.u{text-decoration:underline}
    .box{fill:#fff;stroke:#333}.bar{fill:#eee;stroke:#333}.sel{fill:#ddd;stroke:#333}.dash{fill:#fff;stroke:#666;stroke-dasharray:5 4}
    .hd{fill:#ddd;stroke:#999}.row{fill:#fff;stroke:#bbb}.dark{fill:#333;stroke:#333}.err{fill:#fff;stroke:#333;stroke-width:2}
    .c{fill:#333;stroke:#fff;stroke-width:1.5}.n{font-size:12px;font-weight:bold;fill:#fff;text-anchor:middle}
  </style>

  <rect x="0" y="0" width="1200" height="780" fill="#ffffff"/>
  <rect x="10" y="10" width="1180" height="700" fill="#ffffff" stroke="#333333" stroke-width="2"/>

  <!-- Top bar -->
  <rect class="bar" x="10" y="10" width="1180" height="56"/>
  <text x="30" y="45" style="font-size:22px;font-weight:bold">Matriz</text>
  <rect class="box" x="150" y="24" width="100" height="30"/>
  <text x="200" y="44" class="m">Dashboard</text>
  <rect class="sel" x="260" y="24" width="100" height="30"/>
  <text x="310" y="44" class="m b">Projects</text>
  <rect class="box" x="900" y="22" width="190" height="32" rx="4"/>
  <text x="912" y="43">Ana Example (Team member)</text>
  <rect class="box" x="1100" y="22" width="70" height="32" rx="4"/>
  <text x="1135" y="43" class="m">Sign out</text>

  <text x="30" y="110" class="l">Projects</text>

  <!-- Search and new -->
  <rect class="box" x="30" y="125" width="380" height="34" rx="3"/>
  <text x="42" y="147">web</text>
  <rect class="box" x="420" y="125" width="80" height="34" rx="3"/>
  <text x="460" y="147" class="m">Search</text>
  <rect class="dash" x="560" y="125" width="150" height="34" rx="4"/>
  <text x="635" y="147" class="m b" style="fill:#666">+ New project</text>

  <!-- List -->
  <rect class="hd" x="30" y="175" width="680" height="32"/>
  <text x="44" y="196" class="b">Name</text>
  <text x="270" y="196" class="b">Phase</text>
  <text x="370" y="196" class="b">Status</text>
  <text x="470" y="196" class="b">Manager</text>
  <text x="575" y="196" class="b">Actions</text>

  <rect class="row" x="30" y="207" width="680" height="40"/>
  <text x="44" y="232" class="u b">Website Redesign</text>
  <text x="270" y="232">Execution</text>
  <text x="370" y="232">In progress</text>
  <text x="470" y="232">Marta</text>
  <rect class="box" x="575" y="215" width="42" height="24" rx="3"/><text x="596" y="231" class="m s">Open</text>
  <rect class="dash" x="622" y="215" width="40" height="24" rx="3"/><text x="642" y="231" class="m s" style="fill:#666">Edit</text>
  <rect class="dash" x="666" y="215" width="40" height="24" rx="3"/><text x="686" y="231" class="m s" style="fill:#666">Delete</text>

  <rect class="row" x="30" y="247" width="680" height="40"/>
  <text x="44" y="272" class="u b">Web Portal</text>
  <text x="270" y="272">Planning</text>
  <text x="370" y="272">Completed</text>
  <text x="470" y="272">Marta</text>
  <rect class="box" x="575" y="255" width="42" height="24" rx="3"/><text x="596" y="271" class="m s">Open</text>
  <rect class="dash" x="622" y="255" width="40" height="24" rx="3"/><text x="642" y="271" class="m s" style="fill:#666">Edit</text>
  <rect class="dash" x="666" y="255" width="40" height="24" rx="3"/><text x="686" y="271" class="m s" style="fill:#666">Delete</text>

  <text x="30" y="312" class="s g">Search finds the text anywhere in the name and includes completed projects. With no match: "No projects found."</text>

  <!-- Delete confirmation -->
  <text x="120" y="352" class="s g">Confirmation shown after Delete</text>
  <rect x="120" y="360" width="500" height="150" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="140" y="390" class="b">Delete project?</text>
  <text x="140" y="414" class="s">"Website Redesign" and its tasks go to the Recycle bin for 30 days.</text>
  <text x="140" y="432" class="s">Only the project manager can restore them.</text>
  <rect class="box" x="400" y="458" width="90" height="34" rx="3"/><text x="445" y="480" class="m">Cancel</text>
  <rect class="dark" x="505" y="458" width="95" height="34" rx="3"/><text x="552" y="480" class="m w b">Delete</text>

  <!-- Form panel (manager only) -->
  <rect class="dash" x="750" y="125" width="420" height="535"/>
  <text x="770" y="152" class="b" style="font-size:15px">New project</text>
  <text x="870" y="152" class="s g">(the same form is used to edit)</text>

  <text x="770" y="170" class="s b">Name *</text>
  <rect class="box" x="770" y="178" width="380" height="30" rx="3"/>
  <text x="780" y="198" class="g">max 100 characters</text>
  <text x="770" y="232" class="s b">Description</text>
  <rect class="box" x="770" y="240" width="380" height="50" rx="3"/>
  <text x="780" y="260" class="g">max 2000 characters</text>
  <text x="770" y="308" class="s b">Start date *</text>
  <rect class="box" x="770" y="316" width="200" height="30" rx="3"/><text x="780" y="336">2026-01-01</text>
  <rect class="box" x="980" y="316" width="170" height="30" rx="3"/><text x="990" y="336" class="g">time (optional)</text>
  <text x="770" y="364" class="s b">End date *</text>
  <rect class="err" x="770" y="372" width="200" height="30" rx="3"/><text x="780" y="392">2026-01-01</text>
  <rect class="box" x="980" y="372" width="170" height="30" rx="3"/><text x="990" y="392" class="g">time (optional)</text>
  <text x="770" y="418" class="s">The end must be after the start. Choose a later date or time.</text>
  <text x="770" y="436" class="s b">Time zone</text>
  <rect class="box" x="770" y="444" width="380" height="30" rx="3"/><text x="780" y="464">Lisbon (default)</text><text x="1130" y="464">▼</text>
  <text x="770" y="492" class="s b">Phase</text>
  <rect class="box" x="770" y="500" width="185" height="30" rx="3"/><text x="780" y="520">Execution</text><text x="935" y="520">▼</text>
  <text x="965" y="492" class="s b">Status</text>
  <rect class="box" x="965" y="500" width="185" height="30" rx="3"/><text x="975" y="520">In progress</text><text x="1130" y="520">▼</text>
  <text x="770" y="548" class="s b">Manager *</text>
  <rect class="box" x="770" y="556" width="380" height="30" rx="3"/><text x="780" y="576">Marta</text><text x="1130" y="576">▼</text>
  <rect class="dark" x="770" y="606" width="100" height="34" rx="3"/><text x="820" y="628" class="m w b">Save</text>
  <rect class="box" x="880" y="606" width="100" height="34" rx="3"/><text x="930" y="628" class="m">Cancel</text>

  <!-- Callouts -->
  <circle class="c" cx="30" cy="125" r="11"/><text class="n" x="30" y="129">1</text>
  <circle class="c" cx="30" cy="207" r="11"/><text class="n" x="30" y="211">2</text>
  <circle class="c" cx="575" cy="215" r="11"/><text class="n" x="575" y="219">3</text>
  <circle class="c" cx="662" cy="215" r="11"/><text class="n" x="662" y="219">4</text>
  <circle class="c" cx="560" cy="125" r="11"/><text class="n" x="560" y="129">5</text>
  <circle class="c" cx="750" cy="125" r="11"/><text class="n" x="750" y="129">6</text>
  <circle class="c" cx="965" cy="492" r="11" transform="translate(-18 -10)"/><text class="n" x="947" y="486">7</text>
  <circle class="c" cx="752" cy="412" r="11"/><text class="n" x="752" y="416">8</text>
  <circle class="c" cx="120" cy="360" r="11"/><text class="n" x="120" y="364">9</text>

  <text x="10" y="735">Dashed outline = shown only to the project manager. A thick outline marks a field with an error message. Numbers refer to docs/ui/wireframes.md.</text>
  <text x="10" y="753" class="g">Low-fidelity wireframe. All names are fictitious.</text>
</svg>
