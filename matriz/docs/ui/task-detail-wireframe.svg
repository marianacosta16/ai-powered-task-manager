<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830">
  <title>Matriz - wireframe of the Task detail screen (low fidelity)</title>
  <desc>Low-fidelity wireframe of the Task detail screen (F02, F03, F08, F17, US02, US04, US11): data, editing, status, priority, assignees, subtasks, comments and deletion. All data is fictitious.</desc>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#333}
    .g{fill:#777}.b{font-weight:bold}.s{font-size:11px}.m{text-anchor:middle}.w{fill:#fff}.l{font-size:20px;font-weight:bold}.u{text-decoration:underline}
    .box{fill:#fff;stroke:#333}.bar{fill:#eee;stroke:#333}.sel{fill:#ddd;stroke:#333}.dash{fill:#fff;stroke:#666;stroke-dasharray:5 4}
    .hd{fill:#ddd;stroke:#999}.row{fill:#fff;stroke:#bbb}.dark{fill:#333;stroke:#333}.card{fill:#fafafa;stroke:#999}
    .c{fill:#333;stroke:#fff;stroke-width:1.5}.n{font-size:12px;font-weight:bold;fill:#fff;text-anchor:middle}
  </style>

  <rect x="0" y="0" width="1200" height="830" fill="#ffffff"/>
  <rect x="10" y="10" width="1180" height="770" fill="#ffffff" stroke="#333333" stroke-width="2"/>

  <!-- Top bar -->
  <rect class="bar" x="10" y="10" width="1180" height="56"/>
  <text x="30" y="45" style="font-size:22px;font-weight:bold">Matriz</text>
  <rect class="box" x="150" y="24" width="100" height="30"/>
  <text x="200" y="44" class="m">Dashboard</text>
  <rect class="sel" x="260" y="24" width="100" height="30"/>
  <text x="310" y="44" class="m b">Projects</text>
  <rect class="box" x="900" y="22" width="190" height="32" rx="4"/>
  <text x="912" y="43">Ana Example (Team member)</text>
  <rect class="box" x="1100" y="22" width="70" height="32" rx="4"/>
  <text x="1135" y="43" class="m">Sign out</text>

  <text x="30" y="92" class="s g">Projects / Website Redesign / Fix payment bug</text>

  <!-- Main column -->
  <rect class="box" x="30" y="104" width="560" height="36" rx="3"/>
  <text x="42" y="128" class="b" style="font-size:16px">Fix payment bug</text>
  <rect class="box" x="600" y="108" width="120" height="28" rx="14"/>
  <text x="660" y="127" class="m s">Quadrant: Do first</text>

  <text x="30" y="166" class="s b">Description</text>
  <rect class="box" x="30" y="172" width="690" height="70" rx="3"/>
  <text x="42" y="194" class="g">Refunds fail with an error when the gateway times out.</text>

  <text x="30" y="266" class="s b">Status</text>
  <rect class="box" x="30" y="272" width="160" height="30" rx="3"/><text x="42" y="292">In progress</text><text x="170" y="292">▼</text>
  <text x="205" y="266" class="s b">Deadline</text>
  <rect class="box" x="205" y="272" width="160" height="30" rx="3"/><text x="217" y="292">2026-11-20</text>
  <text x="380" y="266" class="s b">Urgency</text>
  <rect class="box" x="380" y="272" width="160" height="30" rx="3"/><text x="392" y="292">4 - Critical</text><text x="520" y="292">▼</text>
  <text x="555" y="266" class="s b">Importance</text>
  <rect class="box" x="555" y="272" width="165" height="30" rx="3"/><text x="567" y="292">4 - Critical</text><text x="700" y="292">▼</text>

  <text x="30" y="326" class="s b" style="fill:#666">Block reason (only when Blocked)</text>
  <rect class="dash" x="30" y="332" width="330" height="30" rx="3"/><text x="42" y="352" class="g s">max 100 characters</text>
  <text x="380" y="326" class="s b" style="fill:#666">Original task (only when Duplicate)</text>
  <rect class="dash" x="380" y="332" width="340" height="30" rx="3"/><text x="392" y="352" class="g s">same project, not a duplicate</text>

  <text x="30" y="392" class="s b">Assignees (at least one)</text>
  <rect class="box" x="30" y="400" width="80" height="28" rx="14"/><text x="70" y="419" class="m s">Ana  x</text>
  <rect class="box" x="120" y="400" width="80" height="28" rx="14"/><text x="160" y="419" class="m s">Rui  x</text>
  <rect class="box" x="210" y="400" width="170" height="28" rx="14"/><text x="295" y="419" class="m s">+ Add assignee (members)  ▼</text>
  <text x="30" y="448" class="s g">The last assignee cannot be removed: assign someone else first.</text>

  <text x="30" y="482" class="b">Subtasks</text>
  <rect class="hd" x="30" y="490" width="690" height="28"/>
  <text x="42" y="509" class="s b">Title</text><text x="330" y="509" class="s b">Status</text><text x="440" y="509" class="s b">Deadline</text><text x="560" y="509" class="s b">Assignees</text>
  <rect class="row" x="30" y="518" width="690" height="34"/>
  <text x="42" y="540" class="u s">Check gateway logs</text><text x="330" y="540" class="s">Done</text><text x="440" y="540" class="s">2026-11-10</text><text x="560" y="540" class="s">Ana</text>
  <rect class="row" x="30" y="552" width="690" height="34"/>
  <text x="42" y="574" class="u s">Write regression test</text><text x="330" y="574" class="s">To do</text><text x="440" y="574" class="s">2026-11-18</text><text x="560" y="574" class="s">Rui</text>
  <rect class="box" x="30" y="598" width="140" height="30" rx="3"/><text x="100" y="618" class="m s">+ Add subtask</text>
  <text x="190" y="618" class="s g">A subtask has its own status, deadline, priority, assignees and comments.</text>

  <rect class="dark" x="30" y="660" width="140" height="36" rx="3"/><text x="100" y="683" class="m w b">Save changes</text>
  <rect class="box" x="180" y="660" width="130" height="36" rx="3"/><text x="245" y="683" class="m">Delete task</text>
  <text x="30" y="722" class="s g">Delete sends the task and its comments to the Recycle bin for 30 days.</text>
  <text x="30" y="740" class="s g">In a Completed project the data stays visible but there are no edit, add or delete controls.</text>

  <!-- Comments column -->
  <rect class="card" x="750" y="104" width="420" height="640"/>
  <text x="766" y="130" class="b" style="font-size:15px">Comments (3)</text>
  <text x="900" y="130" class="s g">oldest first</text>

  <rect class="box" x="766" y="146" width="388" height="72"/>
  <text x="778" y="166" class="b s">Rui  -  2026-11-10 09:00</text>
  <text x="778" y="190" class="s">Gateway returns 500 on refunds.</text>

  <rect class="box" x="766" y="228" width="388" height="72"/>
  <text x="778" y="248" class="b s">Ana  -  2026-11-10 10:30</text>
  <text x="778" y="272" class="s">I will check the logs today.</text>
  <text x="1060" y="248" class="s u">Edit</text><text x="1100" y="248" class="s u">Delete</text>

  <rect class="box" x="766" y="310" width="388" height="72"/>
  <text x="778" y="330" class="b s">Marta  -  2026-11-11 08:15</text>
  <text x="778" y="354" class="s">Please prioritise before the demo.</text>

  <text x="766" y="414" class="s b">New comment</text>
  <rect class="box" x="766" y="420" width="388" height="90" rx="3"/>
  <text x="778" y="442" class="g s">Write a comment (max 2000 characters)</text>
  <text x="1154" y="528" class="s g" style="text-anchor:end">0 / 2000</text>
  <rect class="dark" x="766" y="534" width="130" height="34" rx="3"/><text x="831" y="556" class="m w b">Add comment</text>
  <text x="766" y="600" class="s g">Only the author sees Edit and Delete on a comment.</text>
  <text x="766" y="618" class="s g">Deleting a comment removes it for good.</text>

  <!-- Callouts -->
  <circle class="c" cx="30" cy="104" r="11"/><text class="n" x="30" y="108">1</text>
  <circle class="c" cx="30" cy="172" r="11" transform="translate(0 -4)"/><text class="n" x="30" y="172">2</text>
  <circle class="c" cx="30" cy="272" r="11" transform="translate(-0 -0)"/><text class="n" x="30" y="276">3</text>
  <circle class="c" cx="30" cy="332" r="11"/><text class="n" x="30" y="336">4</text>
  <circle class="c" cx="30" cy="400" r="11"/><text class="n" x="30" y="404">5</text>
  <circle class="c" cx="30" cy="490" r="11"/><text class="n" x="30" y="494">6</text>
  <circle class="c" cx="30" cy="660" r="11"/><text class="n" x="30" y="664">7</text>
  <circle class="c" cx="750" cy="104" r="11"/><text class="n" x="750" y="108">8</text>
  <circle class="c" cx="1050" cy="236" r="11" transform="translate(0 -4)"/><text class="n" x="1050" y="236">9</text>
  <circle class="c" cx="766" cy="420" r="11"/><text class="n" x="766" y="424">10</text>

  <text x="10" y="805">Dashed outline = shown only in some cases (Blocked, Duplicate). Numbers refer to docs/ui/wireframes.md.</text>
  <text x="10" y="823" class="g">Low-fidelity wireframe. All names and tasks are fictitious.</text>
</svg>
