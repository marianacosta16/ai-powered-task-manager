<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830">
  <title>Matriz - wireframe of the Task detail screen, view mode (low fidelity)</title>
  <desc>Low-fidelity wireframe of the Task detail screen in view mode (F02, F03, F08, F17, US02, US04, US11): read-only data, subtasks and comments. All data is fictitious.</desc>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#333}
    .g{fill:#777}.b{font-weight:bold}.s{font-size:11px}.m{text-anchor:middle}.w{fill:#fff}.u{text-decoration:underline}
    .box{fill:#fff;stroke:#333}.bar{fill:#eee;stroke:#333}.sel{fill:#ddd;stroke:#333}.dash{fill:#fff;stroke:#666;stroke-dasharray:5 4}
    .hd{fill:#ddd;stroke:#999}.row{fill:#fff;stroke:#bbb}.dark{fill:#333;stroke:#333}.card{fill:#fafafa;stroke:#999}.ln{stroke:#ddd;fill:none}
    .c{fill:#333;stroke:#fff;stroke-width:1.5}.n{font-size:12px;font-weight:bold;fill:#fff;text-anchor:middle}
  </style>

  <rect x="0" y="0" width="1200" height="830" fill="#ffffff"/>
  <rect x="10" y="10" width="1180" height="770" fill="#ffffff" stroke="#333333" stroke-width="2"/>

  <!-- Top bar -->
  <rect class="bar" x="10" y="10" width="1180" height="56"/>
  <text x="30" y="45" style="font-size:22px;font-weight:bold">Matriz</text>
  <rect class="box" x="150" y="24" width="100" height="30"/>
  <text x="200" y="44" class="m">Dashboard</text>
  <rect class="sel" x="260" y="24" width="100" height="30"/>
  <text x="310" y="44" class="m b">Projects</text>
  <rect class="box" x="900" y="22" width="190" height="32" rx="4"/>
  <text x="912" y="43">Ana Example (Team member)</text>
  <rect class="box" x="1100" y="22" width="70" height="32" rx="4"/>
  <text x="1135" y="43" class="m">Sign out</text>

  <text x="30" y="92" class="s g">Projects / Website Redesign / Fix payment bug</text>
  <rect class="bar" x="640" y="76" width="80" height="22" rx="11"/>
  <text x="680" y="91" class="m s b">VIEW MODE</text>

  <!-- Title and actions -->
  <text x="30" y="134" class="b" style="font-size:22px">Fix payment bug</text>
  <rect class="dark" x="490" y="108" width="110" height="34" rx="3"/><text x="545" y="130" class="m w b">Edit task</text>
  <rect class="box" x="610" y="108" width="110" height="34" rx="3"/><text x="665" y="130" class="m">Delete task</text>
  <rect class="box" x="30" y="152" width="140" height="24" rx="12"/>
  <text x="100" y="168" class="m s">Quadrant: Do first</text>

  <text x="30" y="204" class="s g">Description</text>
  <text x="30" y="224">Refunds fail with an error when the gateway times out.</text>

  <line class="ln" x1="30" y1="250" x2="720" y2="250"/>
  <text x="30" y="270" class="s g">Status</text><text x="30" y="292" class="b">In progress</text>
  <text x="205" y="270" class="s g">Deadline</text><text x="205" y="292" class="b">2026-11-20</text>
  <text x="380" y="270" class="s g">Urgency</text><text x="380" y="292" class="b">4 - Critical</text>
  <text x="555" y="270" class="s g">Importance</text><text x="555" y="292" class="b">4 - Critical</text>
  <line class="ln" x1="30" y1="312" x2="720" y2="312"/>
  <text x="30" y="334" class="s g">The block reason and the original task appear here only when the status is Blocked or Duplicate.</text>

  <text x="30" y="372" class="s g">Assignees</text>
  <rect class="box" x="30" y="380" width="70" height="28" rx="14"/><text x="65" y="399" class="m s">Ana</text>
  <rect class="box" x="110" y="380" width="70" height="28" rx="14"/><text x="145" y="399" class="m s">Rui</text>

  <text x="30" y="446" class="b">Subtasks</text>
  <rect class="hd" x="30" y="454" width="690" height="28"/>
  <text x="42" y="473" class="s b">Title</text><text x="330" y="473" class="s b">Status</text><text x="440" y="473" class="s b">Deadline</text><text x="560" y="473" class="s b">Assignees</text>
  <rect class="row" x="30" y="482" width="690" height="34"/>
  <text x="42" y="504" class="u s">Check gateway logs</text><text x="330" y="504" class="s">Done</text><text x="440" y="504" class="s">2026-11-10</text><text x="560" y="504" class="s">Ana</text>
  <rect class="row" x="30" y="516" width="690" height="34"/>
  <text x="42" y="538" class="u s">Write regression test</text><text x="330" y="538" class="s">To do</text><text x="440" y="538" class="s">2026-11-18</text><text x="560" y="538" class="s">Rui</text>
  <rect class="box" x="30" y="562" width="140" height="30" rx="3"/><text x="100" y="582" class="m s">+ Add subtask</text>
  <text x="190" y="582" class="s g">A subtask opens on this same screen, with its own comments.</text>

  <text x="30" y="650" class="s g">Edit task switches the page to edit mode. Delete task sends the task and its comments to the Recycle bin for 30 days.</text>
  <text x="30" y="668" class="s g">In a Completed project the data stays visible and there are no Edit, Delete or Add controls.</text>

  <!-- Comments column -->
  <rect class="card" x="750" y="104" width="420" height="640"/>
  <text x="766" y="130" class="b" style="font-size:15px">Comments (3)</text>
  <text x="900" y="130" class="s g">oldest first</text>

  <rect class="box" x="766" y="146" width="388" height="72"/>
  <text x="778" y="166" class="b s">Rui  -  2026-11-10 09:00</text>
  <text x="778" y="190" class="s">Gateway returns 500 on refunds.</text>

  <rect class="box" x="766" y="228" width="388" height="72"/>
  <text x="778" y="248" class="b s">Ana  -  2026-11-10 10:30</text>
  <text x="778" y="272" class="s">I will check the logs today.</text>
  <text x="1060" y="248" class="s u">Edit</text><text x="1100" y="248" class="s u">Delete</text>

  <rect class="box" x="766" y="310" width="388" height="72"/>
  <text x="778" y="330" class="b s">Marta  -  2026-11-11 08:15</text>
  <text x="778" y="354" class="s">Please prioritise before the demo.</text>

  <text x="766" y="414" class="s b">New comment</text>
  <rect class="box" x="766" y="420" width="388" height="90" rx="3"/>
  <text x="778" y="442" class="g s">Write a comment (max 2000 characters)</text>
  <text x="1154" y="528" class="s g" style="text-anchor:end">0 / 2000</text>
  <rect class="dark" x="766" y="534" width="130" height="34" rx="3"/><text x="831" y="556" class="m w b">Add comment</text>
  <text x="766" y="600" class="s g">Only the author sees Edit and Delete on a comment.</text>
  <text x="766" y="618" class="s g">Deleting a comment removes it for good.</text>
  <text x="766" y="636" class="s g">Comments work the same on a subtask.</text>

  <!-- Callouts -->
  <circle class="c" cx="640" cy="76" r="11"/><text class="n" x="640" y="80">1</text>
  <circle class="c" cx="490" cy="108" r="11"/><text class="n" x="490" y="112">2</text>
  <circle class="c" cx="30" cy="152" r="11"/><text class="n" x="30" y="156">3</text>
  <circle class="c" cx="30" cy="250" r="11"/><text class="n" x="30" y="254">4</text>
  <circle class="c" cx="30" cy="372" r="11" transform="translate(0 -8)"/><text class="n" x="30" y="368">5</text>
  <circle class="c" cx="30" cy="446" r="11" transform="translate(0 -8)"/><text class="n" x="30" y="442">6</text>
  <circle class="c" cx="750" cy="104" r="11"/><text class="n" x="750" y="108">7</text>
  <circle class="c" cx="1050" cy="236" r="11" transform="translate(0 -4)"/><text class="n" x="1050" y="236">8</text>
  <circle class="c" cx="766" cy="420" r="11"/><text class="n" x="766" y="424">9</text>

  <text x="10" y="805">Numbers refer to docs/ui/wireframes.md. This is the view mode; the edit mode is in task-edit-wireframe.svg.</text>
  <text x="10" y="823" class="g">Low-fidelity wireframe. All names and tasks are fictitious.</text>
</svg>
