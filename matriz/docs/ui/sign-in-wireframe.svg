<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <title>Matriz - wireframe of the Sign in screen (low fidelity)</title>
  <desc>Low-fidelity wireframe of the Sign in screen (F10, US10). Two states: wrong credentials and empty fields. All data is fictitious.</desc>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#333}
    .g{fill:#777}.b{font-weight:bold}.s{font-size:11px}.m{text-anchor:middle}.w{fill:#fff}.xl{font-size:26px;font-weight:bold}
    .box{fill:#fff;stroke:#333}.card{fill:#fafafa;stroke:#999}.dark{fill:#333;stroke:#333}.err{fill:#fff;stroke:#333;stroke-width:2}
    .c{fill:#333;stroke:#fff;stroke-width:1.5}.n{font-size:12px;font-weight:bold;fill:#fff;text-anchor:middle}
  </style>

  <rect x="0" y="0" width="1200" height="640" fill="#ffffff"/>
  <rect x="10" y="10" width="1180" height="570" fill="#ffffff" stroke="#333333" stroke-width="2"/>

  <!-- State A: wrong credentials -->
  <text x="60" y="135" class="b">State A: wrong credentials</text>
  <rect class="card" x="60" y="150" width="500" height="400"/>
  <text x="310" y="200" class="m xl">Matriz</text>
  <text x="310" y="228" class="m g">Sign in</text>
  <rect class="box" x="100" y="248" width="420" height="54"/>
  <text x="114" y="270" class="b">Credentials are not correct.</text>
  <text x="114" y="288" class="s">Check your username and password and try again.</text>
  <text x="100" y="330" class="b s">Username</text>
  <rect class="box" x="100" y="338" width="420" height="34" rx="3"/>
  <text x="112" y="360" class="g">ana.example</text>
  <text x="100" y="398" class="b s">Password</text>
  <rect class="box" x="100" y="406" width="420" height="34" rx="3"/>
  <text x="112" y="428" class="g">●●●●●●●●</text>
  <rect class="dark" x="100" y="462" width="420" height="38" rx="4"/>
  <text x="310" y="486" class="m w b">Sign in</text>
  <text x="100" y="530" class="s g">Demonstration environment: fictitious data only.</text>

  <!-- State B: empty fields -->
  <text x="640" y="135" class="b">State B: empty fields</text>
  <rect class="card" x="640" y="150" width="500" height="400"/>
  <text x="890" y="200" class="m xl">Matriz</text>
  <text x="890" y="228" class="m g">Sign in</text>
  <text x="680" y="278" class="b s">Username</text>
  <rect class="err" x="680" y="286" width="420" height="34" rx="3"/>
  <text x="680" y="338" class="s">Enter your username.</text>
  <text x="680" y="366" class="b s">Password</text>
  <rect class="err" x="680" y="374" width="420" height="34" rx="3"/>
  <text x="680" y="426" class="s">Enter your password.</text>
  <rect class="dark" x="680" y="462" width="420" height="38" rx="4"/>
  <text x="890" y="486" class="m w b">Sign in</text>
  <text x="680" y="530" class="s g">Demonstration environment: fictitious data only.</text>

  <!-- Callouts -->
  <circle class="c" cx="100" cy="338" r="11"/><text class="n" x="100" y="342">1</text>
  <circle class="c" cx="100" cy="406" r="11"/><text class="n" x="100" y="410">2</text>
  <circle class="c" cx="100" cy="248" r="11"/><text class="n" x="100" y="252">3</text>
  <circle class="c" cx="664" cy="334" r="11"/><text class="n" x="664" y="338">4</text>
  <circle class="c" cx="100" cy="462" r="11"/><text class="n" x="100" y="466">5</text>
  <circle class="c" cx="84" cy="526" r="11"/><text class="n" x="84" y="530">6</text>

  <text x="10" y="605">Numbers refer to docs/ui/wireframes.md. A thick outline marks a field with an error message.</text>
  <text x="10" y="623" class="g">Low-fidelity wireframe. All names are fictitious.</text>
</svg>
