<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750">
  <title>Matriz - wireframe of the Dashboard screen (low fidelity)</title>
  <desc>Low-fidelity wireframe of the Dashboard (F07, US13): one card per accessible project with task counts by status, and access to the Recycle bin. All data is fictitious.</desc>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#333}
    .g{fill:#777}.b{font-weight:bold}.s{font-size:11px}.m{text-anchor:middle}.w{fill:#fff}.l{font-size:20px;font-weight:bold}.u{text-decoration:underline}.k{font-size:20px;font-weight:bold;text-anchor:middle}
    .box{fill:#fff;stroke:#333}.bar{fill:#eee;stroke:#333}.sel{fill:#ddd;stroke:#333}.dash{fill:#fff;stroke:#666;stroke-dasharray:5 4}
    .card{fill:#fafafa;stroke:#999}.tile{fill:#fff;stroke:#bbb}.fill{fill:#888;stroke:#888}.dark{fill:#333;stroke:#333}
    .c{fill:#333;stroke:#fff;stroke-width:1.5}.n{font-size:12px;font-weight:bold;fill:#fff;text-anchor:middle}
  </style>

  <rect x="0" y="0" width="1200" height="750" fill="#ffffff"/>
  <rect x="10" y="10" width="1180" height="680" fill="#ffffff" stroke="#333333" stroke-width="2"/>

  <!-- Top bar -->
  <rect class="bar" x="10" y="10" width="1180" height="56"/>
  <text x="30" y="45" style="font-size:22px;font-weight:bold">Matriz</text>
  <rect class="sel" x="150" y="24" width="100" height="30"/>
  <text x="200" y="44" class="m b">Dashboard</text>
  <rect class="box" x="260" y="24" width="100" height="30"/>
  <text x="310" y="44" class="m">Projects</text>
  <rect class="box" x="900" y="22" width="190" height="32" rx="4"/>
  <text x="912" y="43">Ana Example (Team member)</text>
  <rect class="box" x="1100" y="22" width="70" height="32" rx="4"/>
  <text x="1135" y="43" class="m">Sign out</text>

  <text x="30" y="110" class="l">Dashboard</text>
  <text x="30" y="132" class="g">Your projects and their tasks by status</text>
  <rect class="box" x="1030" y="98" width="140" height="34" rx="4"/>
  <text x="1100" y="120" class="m b">Recycle bin</text>

  <!-- Card 1 -->
  <rect class="card" x="30" y="150" width="360" height="230"/>
  <text x="46" y="180" class="u b" style="font-size:15px">Website Redesign</text>
  <text x="46" y="200" class="s g">Execution  -  In progress</text>
  <rect class="tile" x="46" y="214" width="78" height="52"/><text class="k" x="85" y="240">1</text><text class="m s g" x="85" y="258">To do</text>
  <rect class="tile" x="130" y="214" width="78" height="52"/><text class="k" x="169" y="240">1</text><text class="m s g" x="169" y="258">In progress</text>
  <rect class="tile" x="214" y="214" width="78" height="52"/><text class="k" x="253" y="240">0</text><text class="m s g" x="253" y="258">In review</text>
  <rect class="tile" x="298" y="214" width="78" height="52"/><text class="k" x="337" y="240">0</text><text class="m s g" x="337" y="258">Blocked</text>
  <rect class="tile" x="46" y="272" width="78" height="52"/><text class="k" x="85" y="298">2</text><text class="m s g" x="85" y="316">Done</text>
  <rect class="tile" x="130" y="272" width="78" height="52"/><text class="k" x="169" y="298">0</text><text class="m s g" x="169" y="316">Cancelled</text>
  <rect class="tile" x="214" y="272" width="78" height="52"/><text class="k" x="253" y="298">0</text><text class="m s g" x="253" y="316">Duplicate</text>
  <rect class="dash" x="46" y="336" width="330" height="32"/>
  <text x="56" y="356" class="s" style="fill:#666">Progress</text>
  <rect class="box" x="116" y="346" width="190" height="14"/><rect class="fill" x="116" y="346" width="95" height="14"/>
  <text x="316" y="357" class="s" style="fill:#666">50%</text>

  <!-- Card 2 -->
  <rect class="card" x="420" y="150" width="360" height="230"/>
  <text x="436" y="180" class="u b" style="font-size:15px">Intranet</text>
  <text x="436" y="200" class="s g">Planning  -  Not started</text>
  <rect class="tile" x="436" y="214" width="78" height="52"/><text class="k" x="475" y="240">0</text><text class="m s g" x="475" y="258">To do</text>
  <rect class="tile" x="520" y="214" width="78" height="52"/><text class="k" x="559" y="240">0</text><text class="m s g" x="559" y="258">In progress</text>
  <rect class="tile" x="604" y="214" width="78" height="52"/><text class="k" x="643" y="240">0</text><text class="m s g" x="643" y="258">In review</text>
  <rect class="tile" x="688" y="214" width="78" height="52"/><text class="k" x="727" y="240">0</text><text class="m s g" x="727" y="258">Blocked</text>
  <rect class="tile" x="436" y="272" width="78" height="52"/><text class="k" x="475" y="298">0</text><text class="m s g" x="475" y="316">Done</text>
  <rect class="tile" x="520" y="272" width="78" height="52"/><text class="k" x="559" y="298">0</text><text class="m s g" x="559" y="316">Cancelled</text>
  <rect class="tile" x="604" y="272" width="78" height="52"/><text class="k" x="643" y="298">0</text><text class="m s g" x="643" y="316">Duplicate</text>
  <rect class="dash" x="436" y="336" width="330" height="32"/>
  <text x="446" y="356" class="s" style="fill:#666">Progress: No tasks</text>

  <!-- Card 3 -->
  <rect class="card" x="810" y="150" width="360" height="230"/>
  <text x="826" y="180" class="u b" style="font-size:15px">Mobile App</text>
  <text x="826" y="200" class="s g">Execution  -  In progress</text>
  <rect class="tile" x="826" y="214" width="78" height="52"/><text class="k" x="865" y="240">4</text><text class="m s g" x="865" y="258">To do</text>
  <rect class="tile" x="910" y="214" width="78" height="52"/><text class="k" x="949" y="240">2</text><text class="m s g" x="949" y="258">In progress</text>
  <rect class="tile" x="994" y="214" width="78" height="52"/><text class="k" x="1033" y="240">1</text><text class="m s g" x="1033" y="258">In review</text>
  <rect class="tile" x="1078" y="214" width="78" height="52"/><text class="k" x="1117" y="240">0</text><text class="m s g" x="1117" y="258">Blocked</text>
  <rect class="tile" x="826" y="272" width="78" height="52"/><text class="k" x="865" y="298">3</text><text class="m s g" x="865" y="316">Done</text>
  <rect class="tile" x="910" y="272" width="78" height="52"/><text class="k" x="949" y="298">0</text><text class="m s g" x="949" y="316">Cancelled</text>
  <rect class="tile" x="994" y="272" width="78" height="52"/><text class="k" x="1033" y="298">0</text><text class="m s g" x="1033" y="316">Duplicate</text>
  <rect class="dash" x="826" y="336" width="330" height="32"/>
  <text x="836" y="356" class="s" style="fill:#666">Progress</text>
  <rect class="box" x="896" y="346" width="150" height="14"/><rect class="fill" x="896" y="346" width="45" height="14"/>
  <text x="1056" y="357" class="s" style="fill:#666">30%  Attention</text>


  <text x="30" y="410" class="s g">Completed projects are not shown on the dashboard, for the manager or for members. They are found in Projects and in the search.</text>

  <!-- Callouts -->
  <circle class="c" cx="900" cy="22" r="11"/><text class="n" x="900" y="26">1</text>
  <circle class="c" cx="170" cy="104" r="11"/><text class="n" x="170" y="108">2</text>
  <circle class="c" cx="30" cy="150" r="11"/><text class="n" x="30" y="154">3</text>
  <circle class="c" cx="46" cy="214" r="11"/><text class="n" x="46" y="218">4</text>
  <circle class="c" cx="46" cy="336" r="11"/><text class="n" x="46" y="340">5</text>
  <circle class="c" cx="1030" cy="98" r="11"/><text class="n" x="1030" y="102">6</text>

  <circle class="c" cx="18" cy="406" r="11"/><text class="n" x="18" y="410">7</text>
  <text x="10" y="715">Dashed outline = shown only to the project manager. Numbers refer to docs/ui/wireframes.md.</text>
  <text x="10" y="733" class="g">Low-fidelity wireframe. All names and tasks are fictitious.</text>
</svg>
