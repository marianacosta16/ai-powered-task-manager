<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" width="1200" height="570">
  <title>Matriz - wireframe of the Dashboard screen (low fidelity)</title>
  <desc>Low-fidelity wireframe of the Dashboard (F07, US13): accessible projects with task counts by status. All data is fictitious.</desc>
  <style>
    text{font-family:Arial,Helvetica,sans-serif;font-size:13px;fill:#333}
    .g{fill:#777}.b{font-weight:bold}.s{font-size:11px}.m{text-anchor:middle}.w{fill:#fff}.l{font-size:20px;font-weight:bold}.u{text-decoration:underline}
    .box{fill:#fff;stroke:#333}.bar{fill:#eee;stroke:#333}.sel{fill:#ddd;stroke:#333}.dash{fill:#fff;stroke:#666;stroke-dasharray:5 4}
    .hd{fill:#ddd;stroke:#999}.row{fill:#fff;stroke:#bbb}.fill{fill:#888;stroke:#888}
    .c{fill:#333;stroke:#fff;stroke-width:1.5}.n{font-size:12px;font-weight:bold;fill:#fff;text-anchor:middle}
  </style>

  <rect x="0" y="0" width="1200" height="570" fill="#ffffff"/>
  <rect x="10" y="10" width="1180" height="500" fill="#ffffff" stroke="#333333" stroke-width="2"/>

  <!-- Top bar -->
  <rect class="bar" x="10" y="10" width="1180" height="56"/>
  <text x="30" y="45" style="font-size:22px;font-weight:bold">Matriz</text>
  <rect class="sel" x="150" y="24" width="100" height="30"/>
  <text x="200" y="44" class="m b">Dashboard</text>
  <rect class="box" x="260" y="24" width="100" height="30"/>
  <text x="310" y="44" class="m">Projects</text>
  <rect class="box" x="900" y="22" width="190" height="32" rx="4"/>
  <text x="912" y="43">Ana Example (Team member)</text>
  <rect class="box" x="1100" y="22" width="70" height="32" rx="4"/>
  <text x="1135" y="43" class="m">Sign out</text>

  <text x="30" y="110" class="l">Dashboard</text>
  <text x="30" y="132" class="g">Your projects and their tasks by status</text>

  <!-- Table header -->
  <rect class="hd" x="30" y="160" width="1140" height="34"/>
  <text x="44" y="182" class="b">Project</text>
  <text x="250" y="182" class="b">Phase</text>
  <text x="360" y="182" class="b">Status</text>
  <text x="470" y="182" class="m b s">To do</text>
  <text x="548" y="182" class="m b s">In progress</text>
  <text x="628" y="182" class="m b s">In review</text>
  <text x="702" y="182" class="m b s">Blocked</text>
  <text x="768" y="182" class="m b s">Done</text>
  <text x="838" y="182" class="m b s">Cancelled</text>
  <text x="918" y="182" class="m b s">Duplicate</text>
  <rect class="dash" x="974" y="160" width="196" height="34"/>
  <text x="990" y="182" class="b" style="fill:#666">Progress (manager only)</text>

  <!-- Row 1 -->
  <rect class="row" x="30" y="194" width="1140" height="44"/>
  <text x="44" y="221" class="u b">Website Redesign</text>
  <text x="250" y="221">Execution</text>
  <text x="360" y="221">In progress</text>
  <text x="470" y="221" class="m">1</text><text x="548" y="221" class="m">1</text><text x="628" y="221" class="m">0</text><text x="702" y="221" class="m">0</text><text x="768" y="221" class="m">2</text><text x="838" y="221" class="m">0</text><text x="918" y="221" class="m">0</text>
  <rect class="box" x="990" y="208" width="80" height="14"/><rect class="fill" x="990" y="208" width="40" height="14"/>
  <text x="1078" y="220" class="s">50%</text>

  <!-- Row 2 -->
  <rect class="row" x="30" y="238" width="1140" height="44"/>
  <text x="44" y="265" class="u b">Intranet</text>
  <text x="250" y="265">Planning</text>
  <text x="360" y="265">Not started</text>
  <text x="470" y="265" class="m">0</text><text x="548" y="265" class="m">0</text><text x="628" y="265" class="m">0</text><text x="702" y="265" class="m">0</text><text x="768" y="265" class="m">0</text><text x="838" y="265" class="m">0</text><text x="918" y="265" class="m">0</text>
  <text x="990" y="265" class="s">No tasks</text>

  <!-- Row 3 -->
  <rect class="row" x="30" y="282" width="1140" height="44"/>
  <text x="44" y="309" class="u b">Mobile App</text>
  <text x="250" y="309">Execution</text>
  <text x="360" y="309">In progress</text>
  <text x="470" y="309" class="m">4</text><text x="548" y="309" class="m">2</text><text x="628" y="309" class="m">1</text><text x="702" y="309" class="m">0</text><text x="768" y="309" class="m">3</text><text x="838" y="309" class="m">0</text><text x="918" y="309" class="m">0</text>
  <rect class="box" x="990" y="296" width="80" height="14"/><rect class="fill" x="990" y="296" width="24" height="14"/>
  <text x="1078" y="308" class="s">30% Attention</text>

  <!-- Row 4 -->
  <rect class="row" x="30" y="326" width="1140" height="44" style="fill:#f3f3f3"/>
  <text x="44" y="353" class="u b g">Old Site</text>
  <text x="250" y="353" class="g">Evaluation</text>
  <text x="360" y="353" class="g">Completed</text>
  <text x="470" y="353" class="m g">0</text><text x="548" y="353" class="m g">0</text><text x="628" y="353" class="m g">0</text><text x="702" y="353" class="m g">0</text><text x="768" y="353" class="m g">8</text><text x="838" y="353" class="m g">1</text><text x="918" y="353" class="m g">0</text>
  <text x="990" y="353" class="s g">not shown</text>

  <text x="30" y="405" class="u b">View all projects →</text>
  <text x="30" y="440" class="s g">Completed projects are shown to members. The manager's dashboard does not show them; they are found through the search on Projects.</text>

  <!-- Callouts -->
  <circle class="c" cx="900" cy="22" r="11"/><text class="n" x="900" y="26">1</text>
  <circle class="c" cx="170" cy="104" r="11"/><text class="n" x="170" y="108">2</text>
  <circle class="c" cx="34" cy="198" r="11"/><text class="n" x="34" y="202">3</text>
  <circle class="c" cx="440" cy="160" r="11"/><text class="n" x="440" y="164">4</text>
  <circle class="c" cx="974" cy="160" r="11"/><text class="n" x="974" y="164">5</text>
  <circle class="c" cx="18" cy="401" r="11"/><text class="n" x="18" y="405">6</text>
  <circle class="c" cx="18" cy="436" r="11"/><text class="n" x="18" y="440">7</text>

  <text x="10" y="535">Dashed outline = shown only to the project manager. Numbers refer to docs/ui/wireframes.md.</text>
  <text x="10" y="553" class="g">Low-fidelity wireframe. All names and tasks are fictitious.</text>
</svg>
