openapi: 3.1.0

info:
  title: Matriz API (MVP contract)
  version: 0.3.0
  description: |
    REST contract for the MVP (v1) of Matriz: sign in and out, projects, team, tasks, assignees, comments, search and filters, dashboard and recycle bin.

    The contract describes an interface only. The backend stack is Java 21 with Spring Boot and PostgreSQL, and the user interface is decided later, after the API (docs/architecture.md, section 8). This file does not depend on any of them.
    References such as F02, R13 or P25 point to docs/requirements.md and docs/constraints.md. Field names follow docs/database.md.
    Who may do what is summarised in docs/requirements.md, section 2.1. A user who has no access to a project always gets 403, also by direct link (S1); a request without a session gets 401.

    Conventions
    - 400: the request is malformed or a field is missing, out of range or too long.
    - 422: the request is well formed but breaks a business rule. The body carries a stable `code` and a message that says why and what to do (NF08).
    - Dates use the time zone of the project (P26).

    Assumptions to confirm (marked "Assumption" in the descriptions)
    - A3 (confirmed): a task always has at least one assignee (R26).
    - A4 (confirmed): only one level of subtasks (M1 in docs/database.md).
    - A5 (confirmed): a task deadline is a date without time (M3 in docs/database.md).
    - A6 (confirmed): the list filters `status` and `quadrant` apply to main tasks and can be combined with `mine` (R25, P29).
    - A7 (confirmed): when a substitute in a member removal is not yet a member, the server adds them to the project in the same transaction (R17).
    - A8 (confirmed): adding someone who is already in the project, or who is its manager, is refused with 422 `MEMBER_ALREADY_IN_PROJECT`.
    - A9 (confirmed): the manager and the members of a project see its team (`listMembers`); only the manager sees the candidates (`listCandidateMembers`).
    - A10 (confirmed): `inOtherOpenProject` is true only while the project itself is open; in a suspended or completed project it is false (P22).
    - A11 (confirmed): `reassignments` names each open task and subtask of the member exactly once; a member without open tasks is removed with an empty list. Without a substitute for every open task the removal is refused with 422 `REPLACEMENT_REQUIRED`.
    - A12 (confirmed): the manager can hand the project to another project manager with `managerId` in `updateProject` (M10). The new manager loses his member row, if he had one, and keeps his tasks (M5, R19, R21). The former manager stops seeing the project, unless he has tasks in it: then he stays as a member.
    - A13 (confirmed): "today" in the start date rule (R29) is the current date in the time zone of the project (P26).
    - A14 (confirmed): a subtask is not created under a parent task that is closed (Done, Cancelled or Duplicate): 422 `PARENT_TASK_CLOSED`, because the closed parent would end up with an open subtask (R4). For the same reason, a closed subtask is not reopened while its parent is closed (the manager reopens the parent first).
    - A15 (confirmed): R4 applies to main tasks and to the statuses Done and Cancelled; a subtask has no subtasks, and a Duplicate parent is not checked.
    - A16 (confirmed): assigning someone who is already an assignee is accepted and changes nothing (200 with the assignees).
    - A17 (confirmed): `blockReason` and `originalTaskId` sent with a status that does not use them are refused with 400; leaving Blocked or Duplicate clears them.
    - A18 (confirmed): the deadline is validated (R13, R2, R3) only when it is changed; saving the same deadline again is not an error.
    - A19 (confirmed): creating a task or a subtask in a completed or in a suspended project is refused with 422 `PROJECT_NOT_OPEN` (R22); changing, assigning or removing in a completed project is 422 `PROJECT_COMPLETED` (R27, R28).
    - A20 (confirmed): an update that changes nothing is accepted and does not change the `version`, so it never makes another editor's save fail with `409`; a save that carries an old `version` is still refused.
    - A21 (confirmed): the limit of 5 open tasks and subtasks of a substitute (R17, P24) counts the open tasks the substitute has in this project, plus those received.
    - A22 (confirmed): the closed tasks of the member who is removed keep him as an assignee (history); only the open ones pass to the substitutes.
    - A23 (confirmed): a `reassignments` entry for a task that is not an open task of the member in this project, or a task named twice, is refused with 400; a substitute who does not exist, who is the member removed or who is already an assignee of that task is refused with 422 `REPLACEMENT_NOT_ELIGIBLE`.
    - A24 (confirmed): the comments of a closed task or subtask (Done, Cancelled or Duplicate) are only read: they are not added, edited or deleted (422 `TASK_CLOSED`, P37). The manager reopens the task to allow it again (P8).
    - A25 (confirmed): a comment made only of spaces is refused with 400.
    - A26 (confirmed): only the author edits or deletes a comment, not even the manager of the project (403). In a completed project the answer is 422 `PROJECT_COMPLETED`, and on a closed task 422 `TASK_CLOSED`, both before the author is checked.
    - A27 (confirmed): the date of a comment is set by the server clock when it is created and never changes; the body accepts only `content`, and an `authorId` or `createdAt` is refused with 400.
    - A28 (confirmed): `status` and `quadrant` of `listProjectTasks` accept only the exact labels of `TaskStatus` and `Quadrant`; any other value, or a `mine` that is not `true` or `false`, is refused with 400 (after the 403 check).
    - A29 (confirmed): tasks that tie on status group, deadline, urgency and importance are listed in the order they were created (by id), so the list never changes order between two requests.
    - A30 (confirmed): `listProjectTasks` and `listComments` come in pages, with `page` from 1 and `size` from 1 to 200, 50 if omitted. A value outside this, or one that is not a whole number, is refused with 400, after the 403 check; it is not corrected silently.
    - A31 (confirmed): the total of the whole list is in the `X-Total-Count` header, so the body stays a plain array; for the tasks it counts the main tasks that match the filters, and a page past the last one is a 200 with an empty array.
    - A32 (confirmed): the progress and the elapsed time are each rounded to two decimals before the deviation is taken, so the deviation is exactly the difference of the two values shown (P5). Example: 50.00 elapsed and 33.33 done make a deviation of 16.67.
    - A33 (confirmed): a project is late by date from the very instant its end is reached, not after it: an end with a time of 18:00 is late at 18:00, and an end without a time is late at 00:00 of the next day (scenarios 6.14 and 6.15).
    - A34 (confirmed): the dashboard lists the projects ordered by name, ignoring case, and by id when the names are equal, so the order does not change between two requests.

tags:
  - name: Auth
    description: Sign in, sign out and the authenticated user (F10).
  - name: Projects
    description: Projects, search and the team (F01, F22).
  - name: Tasks
    description: Tasks, subtasks and assignees (F02, F03, F05, F08).
  - name: Comments
    description: Comments on tasks and subtasks (F17).
  - name: Dashboard
    description: Dashboard with the accessible projects (F07).
  - name: Recycle bin
    description: Deleted projects, tasks and subtasks (F09).

security:
  - session: []

paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: signIn
      summary: Sign in
      description: |
        Starts a session with a demonstration account (F10, S5). The session ends on sign out or after 3 hours without activity (see the session cycle in the `session` security scheme).
        The same error is returned when the username or the password is wrong, without saying which one (scenario 10.2).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignIn'
      responses:
        '200':
          description: Signed in. The session cookie is set and the authenticated user is returned.
          headers:
            Set-Cookie:
              description: The session cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: The credentials are not correct.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_CREDENTIALS
                message: Credentials are not correct. Check your username and password and try again.

  /auth/logout:
    post:
      tags: [Auth]
      operationId: signOut
      summary: Sign out
      description: Ends the current session and asks the client to drop the cookie (`Set-Cookie` with `Max-Age=0`) (scenario 10.4).
      responses:
        '204':
          description: Signed out.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Auth]
      operationId: getAuthenticatedUser
      summary: Get the authenticated user
      description: Returns the name and role of the user of the current session (scenario 10.3).
      responses:
        '200':
          description: The authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List and search projects
      description: |
        Returns the projects the user can access, completed and suspended ones included (R8, R25). The order is not defined yet.
        With `search`, only projects whose name contains the text, ignoring case (P29).
      parameters:
        - name: search
          in: query
          description: Text to find anywhere in the project name.
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: The accessible projects. An empty array when there is no match ("No projects found.").
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a project
      description: |
        Only a project manager creates projects (F01, R19). The creator indicates the manager of the project; if it is someone else, the creator stops seeing the project.
        Rules: name up to 100 and description up to 2000 characters (R14); start and end dates are required and the end is not before the start (R16); the start date is not in the past, and today is accepted (R29, A13); the manager must have the role Project manager (M10). A single day with no times is accepted, because the end day counts whole (P26).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '201':
          description: Project created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'

  /projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: getProject
      summary: Get a project
      description: Returns the data of a project the user can access. A completed project can still be viewed (R28).
      responses:
        '200':
          description: The project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Projects]
      operationId: updateProject
      summary: Update a project
      description: |
        Only the manager of the project changes its data, phase and status (R12). The states Attention and Late cannot be set (they are calculated, P5).
        A completed project cannot be changed or reopened (R28). The start date is validated only when it is changed (R29). Assumption A12: `managerId` hands the project to another project manager.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      responses:
        '200':
          description: The updated project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'
    delete:
      tags: [Projects]
      operationId: deleteProject
      summary: Delete a project
      description: |
        Only the manager of the project deletes it. The project and its tasks go to the recycle bin for 30 days (R9, R20).
        A completed project cannot be deleted (R28).
      responses:
        '204':
          description: Project moved to the recycle bin.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'

  /projects/{projectId}/members:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: listMembers
      summary: List the members of a project
      description: |
        Returns the members, with the number of open tasks and subtasks of each one. The manager of the project is not listed (M5).
        `inOtherOpenProject` is the red label of a member of a resumed project who is also in another open project (P22, A10). The manager and the members of the project can list the team (A9).
      responses:
        '200':
          description: The members.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Projects]
      operationId: addMember
      summary: Add a member to a project
      description: |
        Only the manager of the project adds members, in an open or suspended project; a completed project cannot be changed (R28).
        In an open project, a person who is already a member of another open project is refused (R11); this does not apply to project managers. Assumption A8: someone already in the project, or its manager, is refused with 422 `MEMBER_ALREADY_IN_PROJECT`. In a suspended project the check does not apply, because the project is not open (P4); when it is resumed, P22 applies.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMember'
      responses:
        '201':
          description: Member added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'

  /projects/{projectId}/members/{userId}/removal:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Projects]
      operationId: removeMember
      summary: Remove a member from a project
      description: |
        Only the manager of the project removes members (R17), in an open or suspended project; a completed project cannot be changed (R28). The member is freed for another open project.
        Every open task and subtask of the member, including those shared with other assignees, needs a substitute in `reassignments`; they can be split among several substitutes. A substitute cannot already be an assignee of that task (P24).
        Nobody can end up with more than 5 open tasks and subtasks in total (R17, P24). Assumption A7: a substitute who is not yet a member is added to the project in the same transaction.
        Without a substitute for every open task the removal is not completed (scenarios 1.13 and 1.25): 422 `REPLACEMENT_REQUIRED` (A11), `REPLACEMENT_NOT_ELIGIBLE` (A23), `MEMBER_IN_OTHER_OPEN_PROJECT` for a new member who is in another open project (R11, scenario 1.14) and `ASSIGNEE_LIMIT_EXCEEDED` (A21). Everything is done in one transaction: if a check fails nothing changes. The closed tasks keep the member (A22).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberRemoval'
      responses:
        '204':
          description: Member removed and tasks reassigned.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'

  /projects/{projectId}/candidate-members:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: listCandidateMembers
      summary: List the people who can be added to a project
      description: |
        Used by the manager to choose a member to add or a substitute. Returns everyone who is not yet in the project, saying who is available.
        A person already in another open project is returned as unavailable, with the reason (R11, scenario 1.5).
      responses:
        '200':
          description: The candidates.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Candidate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/assignable-users:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: listAssignableUsers
      summary: List the users who can be assigned to tasks of a project
      description: 'Returns the eligible assignees, which are the members of the project and its manager (R21).'
      responses:
        '200':
          description: The eligible users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /projects/{projectId}/tasks:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Tasks]
      operationId: createTask
      summary: Create a task or a subtask
      description: |
        Creates a task in the project. If `parentTaskId` is given, the new item is a subtask of that task.

        Rules applied (docs/requirements.md):
        - R1: the deadline is required.
        - R13: the deadline cannot be in the past; today is accepted.
        - R2: a subtask deadline cannot be later than its parent task deadline.
        - R14: title up to 100 characters and description up to 2000.
        - R21: every assignee must be a member of the project or its manager.
        - R22: tasks can only be created in an open project; a `Completed` or `Suspended` project refuses the creation (A19).
        - A14: a subtask is not created under a closed parent task (422 `PARENT_TASK_CLOSED`).
        - R6 does not apply here: a task is never created as `Blocked` or `Duplicate`.

        The new task has status `To do` (scenario 2.1). Assumption A3: at least one assignee is required.
        Who can create: any member of the project and its manager (R8, S1). A project that is deleted is treated as not found.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
            examples:
              mainTask:
                summary: Main task
                value:
                  title: Prepare kick-off meeting
                  description: Agenda and invitations for the whole team.
                  deadline: 2026-12-15
                  urgency: 3
                  importance: 4
                  assigneeIds: [12, 15]
              subtask:
                summary: Subtask
                value:
                  title: Send invitations
                  deadline: 2026-12-10
                  urgency: 2
                  importance: 2
                  assigneeIds: [12]
                  parentTaskId: 101
      responses:
        '201':
          description: Task created. The body is the created task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: The request is well formed but breaks a business rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                deadlineInPast:
                  summary: R13
                  value:
                    code: DEADLINE_IN_PAST
                    message: The deadline cannot be in the past. Choose today or a later date.
                subtaskDeadlineAfterParent:
                  summary: R2
                  value:
                    code: SUBTASK_DEADLINE_AFTER_PARENT
                    message: The subtask deadline cannot be later than the parent task deadline. Choose an earlier date.
                assigneeNotMember:
                  summary: R21
                  value:
                    code: ASSIGNEE_NOT_MEMBER
                    message: Every assignee must be a member of the project. Add the person to the project first.
                projectNotOpen:
                  summary: R22
                  value:
                    code: PROJECT_NOT_OPEN
                    message: Tasks cannot be created in a completed or suspended project.
                parentIsSubtask:
                  summary: A4
                  value:
                    code: PARENT_IS_SUBTASK
                    message: A subtask cannot have subtasks. Choose a main task as parent.
    get:
      tags: [Tasks]
      operationId: listProjectTasks
      summary: List the tasks of a project
      description: |
        Returns the main tasks of the project, including those in a final status (`Done`, `Cancelled`, `Duplicate`) (R15).
        Open tasks come first, then closed ones. Inside each group, tasks are ordered by deadline, earliest first; with the same deadline, by urgency and then importance, highest first (R23).

        Subtasks are not listed on their own: each appears inside `subtasks` of its parent task (R18).
        The Matrix view hides tasks in a final status (P10), so the client can filter them out of this result.
        Tasks and subtasks that were deleted (recycle bin, R20) are not returned.

        With `mine=true` only the tasks of the current user are returned: a main task is included if the user is assignee of it or of any of its subtasks (P25).
        The filters `mine`, `status` and `quadrant` can be combined (R25, A6).

        The list comes in pages (A30): `page` from 1 and `size` from 1 to 200 (50 if omitted). The subtasks inside a task do not count towards the page. `X-Total-Count` is the number of main tasks that match the filters, in all the pages (A31).
      parameters:
        - name: mine
          in: query
          description: When `true`, return only the tasks of the current user ("My tasks", P25).
          required: false
          schema:
            type: boolean
            default: false
        - name: status
          in: query
          description: Only tasks with this status (F22, R25).
          required: false
          schema:
            $ref: '#/components/schemas/TaskStatus'
        - name: quadrant
          in: query
          description: Only tasks in this Matrix quadrant, calculated from urgency and importance. This is the "priority" filter (F22, R25).
          required: false
          schema:
            $ref: '#/components/schemas/Quadrant'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: One page of the main tasks. It is an empty array when the project has no tasks or the page is past the last one.
          headers:
            X-Total-Count:
              $ref: '#/components/headers/TotalCount'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tasks]
      operationId: getTask
      summary: Get a task or a subtask
      description: Returns the data, assignees and subtasks of a task, or the data of a subtask. Members and the manager of the project can read it, in any project state.
      responses:
        '200':
          description: The task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Tasks]
      operationId: updateTask
      summary: Update a task or a subtask
      description: |
        Edits the data, status, priority and deadline. Allowed in an open or suspended project, never in a completed one (R27, R28).
        Rules: R13 and R2 apply whenever a deadline is set or changed; R3 blocks moving the deadline of a parent before one of its subtasks; a task with open subtasks cannot be completed or cancelled (R4); a `Blocked` task needs a reason of up to 100 characters; a `Duplicate` task needs its original, from the same project, different from itself and not a duplicate (R6).
        Reopening a task in a final status is allowed only to the manager of the project (P8), and a subtask is not reopened while its parent is closed (A14).
        Simultaneous edits (R30, T13): the body carries the `version` of the task that was read. If someone saved the task in the meantime, the update is refused with `409` and nothing is changed; the client reloads the task and tries again. On success the `version` goes up by one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdate'
      responses:
        '200':
          description: The updated task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TaskChanged'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'
    delete:
      tags: [Tasks]
      operationId: deleteTask
      summary: Delete a task or a subtask
      description: |
        Sends the task, its subtasks and its comments to the recycle bin for 30 days (R9, R20). Allowed in an open or suspended project (R27).
        A task with open subtasks is not deleted (R9).
      responses:
        '204':
          description: Task moved to the recycle bin.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'

  /tasks/{taskId}/assignees:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Tasks]
      operationId: addAssignee
      summary: Assign a user to a task
      description: |
        Adds an assignee. The user must be a member of the project or its manager (R21, scenario 2.9). Allowed in an open or suspended project (R27).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddAssignee'
      responses:
        '200':
          description: The assignees of the task after the change.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'

  /tasks/{taskId}/assignees/{userId}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/UserId'
    delete:
      tags: [Tasks]
      operationId: removeAssignee
      summary: Remove an assignee from a task
      description: |
        Removes the assignment. The last assignee cannot be removed: someone else must be assigned first (R26, scenario 2.11). Allowed in an open or suspended project (R27).
      responses:
        '204':
          description: Assignment removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'

  /tasks/{taskId}/comments:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Comments]
      operationId: listComments
      summary: List the comments of a task or subtask
      description: |
        Returns the comments from the oldest to the newest, with author and date (R24, scenario 11.2). With the same date, the one created first comes first.

        The list comes in pages (A30): `page` from 1 and `size` from 1 to 200 (50 if omitted). `X-Total-Count` is the number of comments of the task, in all the pages (A31).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: One page of the comments. It is an empty array when the page is past the last one.
          headers:
            X-Total-Count:
              $ref: '#/components/headers/TotalCount'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Comments]
      operationId: addComment
      summary: Add a comment to a task or subtask
      description: |
        Any member of the project and its manager can comment. The author and the date are set by the application (R24).
        Allowed in an open or suspended project, never in a completed one (R28). The text is plain text of up to 2000 characters (NF09), and not only spaces (A25). A closed task or subtask takes no new comments (422 `TASK_CLOSED`, A24). Only `content` is accepted: the author and the date are never taken from the request (A27).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentWrite'
      responses:
        '201':
          description: Comment added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'

  /comments/{commentId}:
    parameters:
      - $ref: '#/components/parameters/CommentId'
    patch:
      tags: [Comments]
      operationId: editComment
      summary: Edit a comment
      description: |
        Only the author edits their comment, not even the manager (R24, A26). The author and the creation date do not change (A27). Not allowed in a completed project (R28) or on a closed task (A24).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentWrite'
      responses:
        '200':
          description: The updated comment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'
    delete:
      tags: [Comments]
      operationId: deleteComment
      summary: Delete a comment
      description: |
        Only the author deletes their comment, and it is removed for good, without the recycle bin (R24, P28). Not allowed in a completed project (R28) or on a closed task (A24).
      responses:
        '204':
          description: Comment deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'

  /dashboard:
    get:
      tags: [Dashboard]
      operationId: getDashboard
      summary: Get the dashboard
      description: |
        Returns the projects the user can access that are not completed (open and suspended), each with the count of its main tasks by status (R18, P27).
        For the manager of a project it also returns the progress and the calculated status (US06, P5, P7, P16); a member, or a manager of another project, gets no `progress` for it (scenario 6.7). Completed projects are not returned; they are found in the project list and search (P27). The projects come ordered by name (A34).

        The calculated status is only for a project `In progress` that has tasks that count (P5, P16). A project that is `Not started` or `Suspended` keeps its status, and a project without tasks that count shows `hasCountableTasks: false` and no percentage. The time is measured in the time zone of the project; an end date without a time counts the whole day (P26, A33). The progress and the elapsed time are rounded to two decimals (A32).
      responses:
        '200':
          description: The dashboard.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DashboardProject'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /recycle-bin:
    get:
      tags: [Recycle bin]
      operationId: listRecycleBin
      summary: List the deleted items
      description: |
        Returns the deleted items of the projects the user can access, with the days left before they are removed for good (R20).
        A project manager sees deleted projects and tasks of their projects; a member sees deleted tasks and subtasks of the projects they belong to (R9).
        An item that cannot be restored says why.
      responses:
        '200':
          description: The deleted items.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecycleItem'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /recycle-bin/projects/{projectId}/restore:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [Recycle bin]
      operationId: restoreProject
      summary: Restore a deleted project
      description: |
        Only a project manager restores projects (R9). The project comes back as it was when it was deleted: the tasks deleted with it return, and those deleted before stay in the recycle bin (scenario 7.7).
      responses:
        '204':
          description: Project restored.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'

  /recycle-bin/tasks/{taskId}/restore:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Recycle bin]
      operationId: restoreTask
      summary: Restore a deleted task or subtask
      description: |
        A member of the project or its manager restores tasks and subtasks (R9). An item is restored only while its project or parent task exists and is not in the recycle bin (scenarios 7.7 and 7.8).
      responses:
        '204':
          description: Task restored.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/BusinessRuleViolation'

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: SESSION
      description: |
        The user signs in with a demonstration account (F10, S5, P21) and the server keeps the session, identified by a cookie.

        Session cycle:
        1. `POST /auth/login` with valid credentials starts the session. The server answers with `Set-Cookie: SESSION=...; HttpOnly; SameSite=Lax; Path=/` and a new identifier at every sign in (a cookie sent by the client is never adopted).
        2. The client sends the cookie in every later request (a browser does it by itself). The server takes the identity of the user from the session, never from the request: who is asking and the author of a comment are set by the server. The manager of a new project is chosen by its creator (R19) and validated by the server (M10).
        3. Each request restarts the 3 hours of inactivity. After 3 hours without any request, or after `POST /auth/logout`, the session no longer exists.
        4. A request without a valid session gets `401` with the code `UNAUTHENTICATED`. If it carried a session cookie, the message says that the session has ended ("Your session has ended. Sign in again to continue."); otherwise it says "Sign in to continue.". The client should then send the user to the sign in screen and show the message.
        5. A signed in user without access to a project gets `403` (`FORBIDDEN`) on any operation on it, also by direct link.

        Requests that change data are not protected by a CSRF token for now: the API only accepts JSON and the cookie is `SameSite=Lax`. To review when the interface is chosen (T1).

  headers:
    TotalCount:
      description: The number of items in the whole list, in all its pages (A31).
      schema:
        type: integer
        minimum: 0

  parameters:
    Page:
      name: page
      in: query
      description: The page of the list, starting at 1 (A30). Any other value is refused with 400.
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      description: How many items in a page, from 1 to 200 (A30). Any other value is refused with 400.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    ProjectId:
      name: projectId
      in: path
      required: true
      description: Identifier of the project.
      schema:
        type: integer
        minimum: 1
    TaskId:
      name: taskId
      in: path
      required: true
      description: Identifier of the task or subtask.
      schema:
        type: integer
        minimum: 1
    UserId:
      name: userId
      in: path
      required: true
      description: Identifier of the user.
      schema:
        type: integer
        minimum: 1
    CommentId:
      name: commentId
      in: path
      required: true
      description: Identifier of the comment.
      schema:
        type: integer
        minimum: 1

  responses:
    ValidationError:
      description: Invalid request. A required field is missing or a value is malformed, out of range or too long (R1, R14).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: VALIDATION_ERROR
            message: The title must have at most 100 characters. Shorten it and try again.
            details:
              - field: title
                issue: Longer than 100 characters.
    Unauthorized:
      description: |
        There is no valid session, because the user has not signed in or the session ended (F10). When the request carried a session cookie, the message is "Your session has ended. Sign in again to continue."; the code is the same.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            notSignedIn:
              summary: No session cookie
              value:
                code: UNAUTHENTICATED
                message: Sign in to continue.
            sessionEnded:
              summary: The session cookie is no longer valid
              value:
                code: UNAUTHENTICATED
                message: Your session has ended. Sign in again to continue.
    Forbidden:
      description: The user has no access to this project, or the action is not allowed to their role (R8, S1, section 2.1 of docs/requirements.md).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: FORBIDDEN
            message: You do not have access to this project.
    NotFound:
      description: The resource does not exist or was deleted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_FOUND
            message: The item was not found.
    TaskChanged:
      description: The task was changed by someone else after it was read (R30, T13). Nothing was saved.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: TASK_CHANGED
            message: This task was changed by someone else. Reload it and try again.
    BusinessRuleViolation:
      description: The request is well formed but breaks a business rule. The `code` says which one.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            projectCompleted:
              summary: R27 and R28
              value:
                code: PROJECT_COMPLETED
                message: A completed project cannot be changed or reopened.
            memberInOtherProject:
              summary: R11
              value:
                code: MEMBER_IN_OTHER_OPEN_PROJECT
                message: This person is already in another open project.
            assigneeLimit:
              summary: R17
              value:
                code: ASSIGNEE_LIMIT_EXCEEDED
                message: This person would have more than 5 open tasks. Choose someone else or split the tasks.
            lastAssignee:
              summary: R26
              value:
                code: LAST_ASSIGNEE
                message: A task needs at least one assignee. Assign someone else first.

  schemas:
    SignIn:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          writeOnly: true

    User:
      type: object
      required: [id, name, role]
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          type: string
          enum: [Team member, Project manager]

    Member:
      description: A member of a project, with the number of open tasks and subtasks assigned to them in it.
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [openTaskCount, inOtherOpenProject]
          properties:
            openTaskCount:
              type: integer
              minimum: 0
            inOtherOpenProject:
              type: boolean
              description: True when the member is also in another open project (the red label, P22).

    Candidate:
      type: object
      required: [user, available]
      properties:
        user:
          $ref: '#/components/schemas/User'
        available:
          type: boolean
        unavailableReason:
          type: [string, 'null']
          enum: [IN_OTHER_OPEN_PROJECT, null]
          description: Why the person cannot be added (R11).

    AddMember:
      type: object
      required: [userId]
      additionalProperties: false
      properties:
        userId:
          type: integer
          minimum: 1

    MemberRemoval:
      type: object
      required: [reassignments]
      additionalProperties: false
      properties:
        reassignments:
          type: array
          description: One entry for each open task or subtask of the member. Empty when the member has none.
          items:
            type: object
            required: [taskId, newAssigneeId]
            additionalProperties: false
            properties:
              taskId:
                type: integer
                minimum: 1
              newAssigneeId:
                type: integer
                minimum: 1
                description: The substitute. A member of the project or a free person (A7), who is not already an assignee of the task.

    ProjectPhase:
      type: string
      enum: [Initiation, Planning, Execution, Monitoring, Evaluation]

    ProjectStatus:
      type: string
      description: States set by the manager. Attention and Late are calculated and never set (R12, P5).
      enum: [Not started, In progress, Suspended, Completed]

    ProjectSummary:
      type: object
      required: [id, name, phase, status, manager]
      properties:
        id:
          type: integer
        name:
          type: string
          maxLength: 100
        phase:
          $ref: '#/components/schemas/ProjectPhase'
        status:
          $ref: '#/components/schemas/ProjectStatus'
        manager:
          $ref: '#/components/schemas/User'

    Project:
      allOf:
        - $ref: '#/components/schemas/ProjectSummary'
        - type: object
          required: [startDate, endDate, timezone]
          properties:
            description:
              type: [string, 'null']
              maxLength: 2000
            startDate:
              type: string
              format: date
            startTime:
              type: [string, 'null']
              format: time
              description: Empty means 00:00 (P26).
            endDate:
              type: string
              format: date
            endTime:
              type: [string, 'null']
              format: time
              description: Empty means the whole end day counts (P26).
            timezone:
              type: string
              description: Time zone of the project, Lisbon by default (P26).

    ProjectCreate:
      type: object
      required: [name, startDate, endDate, phase, status, managerId]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 2000
        startDate:
          type: string
          format: date
          description: Not in the past; today is accepted (R29).
        startTime:
          type: string
          format: time
        endDate:
          type: string
          format: date
          description: Not before the start date (R16).
        endTime:
          type: string
          format: time
        timezone:
          type: string
          description: Defaults to Lisbon (P26).
        phase:
          $ref: '#/components/schemas/ProjectPhase'
        status:
          $ref: '#/components/schemas/ProjectStatus'
        managerId:
          type: integer
          minimum: 1
          description: A user with the role Project manager (R19, M10).

    ProjectUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      description: Only the fields to change.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: [string, 'null']
          maxLength: 2000
        startDate:
          type: string
          format: date
        startTime:
          type: [string, 'null']
          format: time
        endDate:
          type: string
          format: date
        endTime:
          type: [string, 'null']
          format: time
        timezone:
          type: string
        phase:
          $ref: '#/components/schemas/ProjectPhase'
        status:
          $ref: '#/components/schemas/ProjectStatus'
        managerId:
          type: integer
          minimum: 1

    TaskCreate:
      type: object
      description: Data to create a task or a subtask. The project comes from the path.
      required: [title, deadline, urgency, importance, assigneeIds]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 100
          description: Task title (R14).
        description:
          type: string
          maxLength: 2000
          description: Optional description (R14, M7).
        deadline:
          type: string
          format: date
          description: |
            Deadline, required (R1). Assumption A5: date only.
            The date is read in the time zone of the project (P26).
        urgency:
          $ref: '#/components/schemas/Level'
        importance:
          $ref: '#/components/schemas/Level'
        assigneeIds:
          type: array
          minItems: 1
          uniqueItems: true
          description: Identifiers of the assignees. All must be members of the project or its manager (R21). Assumption A3 (R26).
          items:
            type: integer
            minimum: 1
        parentTaskId:
          type: integer
          minimum: 1
          description: When given, the new item is a subtask of this main task (F08). The parent must be a main task of the same project (A4).

    TaskUpdate:
      type: object
      required: [version]
      minProperties: 2
      additionalProperties: false
      description: The `version` read, and the fields to change (at least one).
      properties:
        version:
          type: integer
          minimum: 1
          description: The `version` of the task as the client read it (R30).
        title:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: [string, 'null']
          maxLength: 2000
        status:
          $ref: '#/components/schemas/TaskStatus'
        deadline:
          type: string
          format: date
        urgency:
          $ref: '#/components/schemas/Level'
        importance:
          $ref: '#/components/schemas/Level'
        blockReason:
          type: [string, 'null']
          maxLength: 100
          description: Required when the status is `Blocked` (R6).
        originalTaskId:
          type: [integer, 'null']
          description: Required when the status is `Duplicate` (R6).

    Task:
      type: object
      description: A task or a subtask.
      required: [id, version, projectId, parentTaskId, title, status, deadline, urgency, importance, assignees]
      properties:
        id:
          type: integer
        version:
          type: integer
          minimum: 1
          description: Starts at 1 and goes up by one each time the data of the task is changed. Send it back in `updateTask` (R30).
        projectId:
          type: integer
        parentTaskId:
          type: [integer, 'null']
          description: Empty for a main task; the parent task for a subtask.
        title:
          type: string
          maxLength: 100
        description:
          type: [string, 'null']
          maxLength: 2000
        status:
          $ref: '#/components/schemas/TaskStatus'
        deadline:
          type: string
          format: date
        urgency:
          $ref: '#/components/schemas/Level'
        importance:
          $ref: '#/components/schemas/Level'
        quadrant:
          $ref: '#/components/schemas/Quadrant'
        blockReason:
          type: [string, 'null']
          maxLength: 100
          description: Filled only when the status is `Blocked` (R6).
        originalTaskId:
          type: [integer, 'null']
          description: 'Filled only when the status is `Duplicate`, and then it is the original task (R6).'
        assignees:
          type: array
          items:
            $ref: '#/components/schemas/User'
        subtasks:
          type: array
          description: Subtasks of a main task. Present only for main tasks (R18).
          items:
            $ref: '#/components/schemas/Task'

    TaskStatus:
      type: string
      description: Task status. `Done`, `Cancelled` and `Duplicate` are final.
      enum: [To do, In progress, In review, Blocked, Done, Cancelled, Duplicate]

    Level:
      type: integer
      description: Urgency or importance level. 1 = Low, 2 = Medium, 3 = High, 4 = Critical (F03).
      minimum: 1
      maximum: 4

    Quadrant:
      type: string
      description: Matrix quadrant. Levels 1 and 2 count as low and levels 3 and 4 as high (F04, R25).
      enum: [Do first, Schedule, Delegate, Later]

    AddAssignee:
      type: object
      required: [userId]
      additionalProperties: false
      properties:
        userId:
          type: integer
          minimum: 1

    Comment:
      type: object
      required: [id, taskId, author, content, createdAt]
      properties:
        id:
          type: integer
        taskId:
          type: integer
        author:
          $ref: '#/components/schemas/User'
        content:
          type: string
          maxLength: 2000
        createdAt:
          type: string
          format: date-time

    CommentWrite:
      type: object
      required: [content]
      additionalProperties: false
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 2000
          description: Plain text, never interpreted as code or formatting (NF09, P28).

    StatusCounts:
      type: object
      description: Number of main tasks in each status (R18).
      required: [toDo, inProgress, inReview, blocked, done, cancelled, duplicate]
      properties:
        toDo:
          type: integer
          minimum: 0
        inProgress:
          type: integer
          minimum: 0
        inReview:
          type: integer
          minimum: 0
        blocked:
          type: integer
          minimum: 0
        done:
          type: integer
          minimum: 0
        cancelled:
          type: integer
          minimum: 0
        duplicate:
          type: integer
          minimum: 0

    Progress:
      type: object
      description: Progress and calculated status of a project, shown to its manager (P5, P7, P16).
      required: [hasCountableTasks, percent, calculatedStatus]
      properties:
        hasCountableTasks:
          type: boolean
          description: False when there are no countable tasks; the client shows "No tasks" (P16).
        percent:
          type: [number, 'null']
          minimum: 0
          maximum: 100
          description: Done tasks divided by countable main tasks, rounded to two decimals (P7).
        calculatedStatus:
          type: [string, 'null']
          enum: [Attention, Late, null]
          description: Calculated only for projects `In progress` (P5).

    DashboardProject:
      type: object
      required: [project, counts]
      properties:
        project:
          $ref: '#/components/schemas/ProjectSummary'
        counts:
          $ref: '#/components/schemas/StatusCounts'
        progress:
          description: Present only when the user is the manager of the project.
          oneOf:
            - $ref: '#/components/schemas/Progress'
            - type: 'null'

    RecycleItem:
      type: object
      required: [itemType, id, name, deletedAt, daysLeft, restorable]
      properties:
        itemType:
          type: string
          enum: [Project, Task, Subtask]
        id:
          type: integer
        name:
          type: string
        projectName:
          type: [string, 'null']
          description: The project of a task or subtask; empty for a project.
        deletedAt:
          type: string
          format: date-time
        daysLeft:
          type: integer
          minimum: 0
          description: Days before the item is removed for good (R20).
        includedTasks:
          type: [integer, 'null']
          description: For a project, the number of tasks deleted with it.
        restorable:
          type: boolean
        notRestorableReason:
          type: [string, 'null']
          enum: [PARENT_MISSING, PROJECT_IN_RECYCLE_BIN, null]
          description: Why the item cannot be restored (scenario 7.8).

    ErrorCode:
      type: string
      description: Stable code of an error, for the client.
      enum:
        - VALIDATION_ERROR
        - UNAUTHENTICATED
        - INVALID_CREDENTIALS
        - FORBIDDEN
        - NOT_FOUND
        - DEADLINE_IN_PAST
        - SUBTASK_DEADLINE_AFTER_PARENT
        - PARENT_DEADLINE_BEFORE_SUBTASK
        - ASSIGNEE_NOT_MEMBER
        - LAST_ASSIGNEE
        - PROJECT_NOT_OPEN
        - PROJECT_COMPLETED
        - PARENT_IS_SUBTASK
        - PARENT_HAS_OPEN_SUBTASKS
        - BLOCK_REASON_REQUIRED
        - ORIGINAL_TASK_REQUIRED
        - ORIGINAL_TASK_NOT_VALID
        - START_DATE_IN_PAST
        - END_BEFORE_START
        - MANAGER_NOT_A_MANAGER
        - MEMBER_IN_OTHER_OPEN_PROJECT
        - MEMBER_ALREADY_IN_PROJECT
        - REPLACEMENT_REQUIRED
        - REPLACEMENT_NOT_ELIGIBLE
        - ASSIGNEE_LIMIT_EXCEEDED
        - CANNOT_RESTORE
        - TASK_CHANGED
        - PARENT_TASK_CLOSED
        - TASK_CLOSED

    Error:
      type: object
      description: Error body. The message says why the action was refused and what to do (NF08).
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Text shown to the user, in English (NF01).
        details:
          type: array
          description: Fields that failed validation, when applicable.
          items:
            type: object
            required: [field, issue]
            properties:
              field:
                type: string
              issue:
                type: string
