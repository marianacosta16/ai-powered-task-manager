spring:
  application:
    name: matriz
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/matriz}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jackson:
    deserialization:
      fail-on-unknown-properties: true   # the contract uses additionalProperties: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  servlet:
    session:
      timeout: 3h            # S5: ends after 3 hours without activity
      tracking-modes: cookie # never put the session id in the URL
      cookie:
        name: SESSION        # as in openapi.yaml
        http-only: true
        same-site: lax
        # secure: true       # enable when served over HTTPS

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: always

matriz:
  demo:
    # Demo accounts' password; set in the local .env, never in versioned files.
    # Without it, the demo data is not created.
    password: ${DEMO_PASSWORD:}
